<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | Triple Maintenance Group</title>
<link rel="stylesheet" href="base.css">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
body { background: var(--concrete); }
.top { background: var(--paper); border-bottom: 1px solid var(--border); }
.top .wrap { display:flex; align-items:center; justify-content:space-between; padding-top:14px; padding-bottom:14px; }
.top img { height:56px; width:auto; }
.card { background: var(--paper); border:1px solid var(--border); max-width:560px; margin:72px auto; padding:40px 36px; text-align:center; }
.card h1 { font-size:30px; margin-bottom:12px; }
.card p { color: var(--steel); margin-bottom:24px; }
.role { display:inline-block; font-family:'Oswald',sans-serif; letter-spacing:0.06em; text-transform:uppercase; font-size:13px; font-weight:600; background:var(--ink); color:var(--paper); padding:6px 14px; margin-bottom:20px; }
.err { color: var(--red); font-weight:600; }
button.btn { cursor:pointer; background:var(--red); color:var(--paper); border-color:var(--red); }
.linkbtn { background:none; border:0; color:var(--steel); text-decoration:underline; cursor:pointer; font-size:14px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <img src="index-1-ce390515eb.png" alt="Triple Maintenance Group">
  <button class="linkbtn" id="signOut" hidden>Sign out</button>
</div></div>

<div class="wrap">
  <div class="card" id="signedOut" hidden>
    <h1>Sign in</h1>
    <p>For approved Triple Maintenance Group customers and providers. Sign in with the email address TMG has on file for you, or create your password the first time.</p>
    <button class="btn" id="signIn">Sign in</button>
  </div>

  <div class="card" id="loading">
    <p>Signing you in&hellip;</p>
  </div>

  <div class="card" id="home" hidden>
    <span class="role" id="role"></span>
    <h1 id="welcome"></h1>
    <p>Your sign-in works. Your portal is being built and will appear here.</p>
  </div>

  <div class="card" id="problem" hidden>
    <h1>We could not sign you in</h1>
    <p class="err" id="problemText"></p>
    <button class="btn" id="tryAgain">Try again</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
(function () {
  var TENANT_ID = 'e5c156f3-cf39-46ba-85cf-96d9d5722bd2';
  var SUBDOMAIN = 'triplemgportal';
  var CLIENT_ID = 'eef4d6bb-a073-42d2-b24a-ef314da30a3b';
  var API = 'https://tmg-api-04b7d1.azurewebsites.net/api';
  var SCOPES = ['openid', 'profile', 'email'];

  function show(id) {
    ['signedOut', 'loading', 'home', 'problem'].forEach(function (x) {
      document.getElementById(x).hidden = (x !== id);
    });
    document.getElementById('signOut').hidden = (id !== 'home');
  }
  function problem(msg) {
    document.getElementById('problemText').textContent = msg;
    show('problem');
  }

  var app = new msal.PublicClientApplication({
    auth: {
      clientId: CLIENT_ID,
      authority: 'https://' + SUBDOMAIN + '.ciamlogin.com/' + TENANT_ID,
      knownAuthorities: [SUBDOMAIN + '.ciamlogin.com'],
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: 'sessionStorage' }
  });

  function signIn() { app.loginRedirect({ scopes: SCOPES }); }
  document.getElementById('signIn').onclick = signIn;
  document.getElementById('tryAgain').onclick = signIn;
  document.getElementById('signOut').onclick = function () {
    app.logoutRedirect({ postLogoutRedirectUri: window.location.origin + window.location.pathname });
  };

  async function enter(account) {
    show('loading');
    var token;
    try {
      var r = await app.acquireTokenSilent({ scopes: SCOPES, account: account });
      token = r.idToken;
    } catch (e) {
      return app.loginRedirect({ scopes: SCOPES });
    }
    try {
      var resp = await fetch(API + '/external/me', { headers: { Authorization: 'Bearer ' + token } });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) { return problem(data.error || 'Please try again.'); }
      document.getElementById('welcome').textContent = 'Welcome, ' + data.name;
      document.getElementById('role').textContent = data.kind;
      show('home');
    } catch (e) {
      problem('Could not reach the server. Please try again.');
    }
  }

  app.handleRedirectPromise().then(function (result) {
    var account = (result && result.account) || app.getAllAccounts()[0];
    if (account) { enter(account); } else { show('signedOut'); }
  }).catch(function () {
    problem('Sign-in was interrupted. Please try again.');
  });
})();
</script>
</body>
</html>
